# The release workflow, as written for JS / TS projects in the workspace's release-process.md
# (2026-11-10, by binaryang on the owner's word; reference: binaryang's publish.yml). wasmtk
# publishes to JSR only, so it has three of the five jobs, the credential only where it is used:
#
#   checks   no token          the tag is the manifest version and the surface floor holds
#                              (api-surface.ts --verify-tag), the type check, and a publish dry run
#                              on exactly the tree the jsr job publishes
#   jsr      id-token: write   the published files only, nothing installed; skip if JSR has the
#                              version (a re-run); `uploaded` written BEFORE `deno publish`, which is
#                              called DIRECTLY; the Rekor id read back
#   release  contents: write   on `uploaded`, not on deno publish's exit: JSR serves the version →
#                              the tag peels to this commit → the GitHub Release page ON the tag,
#                              through the REST API (never `gh`), an existing page = done → read back
#
# The version tag IS the release (owner, 2026-11-10): no `release/<tag>` branch. A failure after
# JSR's upload: "Re-run failed jobs" — each job skips what is already done — never a new tag for
# the same code. Tests are NOT run here yet: wasmtk's gate is local (installed `wasmtk`, Go, Zig,
# standalone engines); the CI gate is Deno-exit plan P7 (cmem/deno-exit-plan.md).
#
# Every action is pinned to a commit hash; the comment names its release. Move a pin by reading
# the release tag's commit with `git ls-remote` (verified 2026-11-10 for the three below).
#
# JSR side: the package `@jrmarcum/wasmtk` is linked to this repository (JSR → Settings → GitHub
# Actions); no JSR token is needed with OIDC.

name: Publish to JSR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # a non-tag dispatch runs `checks` only

# One run per tag at a time, QUEUED, never cancelled: a cancelled run after `deno publish` and
# before the jobs that follow it would leave a version on JSR without its page (C30 (2)).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # the compatibility gate reads the PREVIOUS v* tag's surface
          persist-credentials: false

      # Every script runs on Bun, locally and here, so the local gate IS CI's gate (workspace
      # `working-rules.md` § The gate; Tooling rule 1). Pinned to the installed Bun (rule 10).
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      # Deno for `deno doc` (the surface JSR sees), the type check and `deno publish` only.
      # DO NOT pin the Deno version to chase JSR provenance: tried 2026-07-30 and RULED OUT (the
      # 2026-07 outage was scope-wide and outside this repo; cmem/design-decisions.md).
      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # The local `deno task bump` ran the compatibility gate on the bump commit; this repeats it on
      # the TAGGED tree (H6, Rule 3), so a tag pushed by hand cannot skip it: the snapshot matches,
      # the version is the tag, one SemVer step at or above the floor since the previous tag, and
      # no removal without a deprecation release (Rule 4). The logic is TypeScript; this only runs it.
      - name: Compatibility gate on the tag (tag = version, the floor holds)
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun scripts/api-surface.ts --verify-tag "${GITHUB_REF_NAME}"

      - name: Type-check
        run: deno check main.ts

      # The `jsr` job publishes from a checkout of deno.json's `publish.include` (+ deno.lock)
      # alone. Rehearse exactly that tree here.
      - name: Checkout the published files only (as the jsr job does)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: jsr-tree
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /deno.json
            /deno.lock
            /main.ts
            /src/
            /README.md
            /LICENSE
            /LICENSE-MIT
            /LICENSE-APACHE

      - name: JSR dry run, on the tree the jsr job publishes
        working-directory: jsr-tree
        run: deno publish --dry-run

  jsr:
    name: Publish ${{ github.ref_name }} to JSR
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Written BEFORE `deno publish`: the jobs after it run on this, not on `deno publish`'s exit
    # (C34 (1): `deno publish` uploads, THEN signs provenance).
    outputs:
      uploaded: ${{ steps.mark.outputs.uploaded }}

    steps:
      # What deno.json publishes, and the one script this job runs. Nothing else, nothing installed.
      - name: Checkout the published files and the workflow script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /deno.json
            /deno.lock
            /main.ts
            /src/
            /README.md
            /LICENSE
            /LICENSE-MIT
            /LICENSE-APACHE
            /scripts/publish-workflow.ts

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      # A re-run after a failure past the upload finds the version there and skips the upload.
      - name: Does JSR already have this version?
        id: jsr
        run: bun scripts/publish-workflow.ts jsr-has "${GITHUB_REF_NAME}"

      # Provenance requires a GitHub OIDC token; `id-token: write` above injects it. If it is absent
      # despite the permission, an org/enterprise Actions OIDC policy blocks it and `deno publish`
      # silently skips provenance. The PREREQUISITE only — a diagnostic, not evidence.
      - name: Check OIDC availability (prerequisite, not proof)
        run: bun scripts/publish-workflow.ts oidc-check

      - name: Record the upload attempt (before the upload)
        id: mark
        run: bun scripts/publish-workflow.ts mark-uploaded

      # `deno publish` called DIRECTLY: through a task or a wrapper it runs as a subprocess, which
      # can lose provenance (binaryang's measurement). scripts/** is outside publish.include.
      - name: Publish to JSR (with provenance)
        if: steps.jsr.outputs.present == 'false'
        run: deno publish

      # THE evidence: JSR's `rekorLogId` (the poll, its cache-bust and their history:
      # scripts/publish-workflow.ts). The version exists either way, so this fails loudly without
      # blocking the `release` job.
      - name: Verify provenance was recorded on JSR
        if: ${{ !cancelled() && steps.mark.outputs.uploaded == 'true' }}
        run: bun scripts/publish-workflow.ts provenance "${GITHUB_REF_NAME}"

  release:
    name: GitHub Release ${{ github.ref_name }}
    needs: jsr
    if: ${{ !cancelled() && needs.jsr.outputs.uploaded == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Only the release script and the manifest it reads the package name from: no package code
      # beside the write token, and the checkout keeps no credential.
      - name: Checkout the release script and the manifest only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /deno.json
            /scripts/publish-workflow.ts

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      # JSR serves the version → the tag peels to this commit → the page ON the tag (an existing
      # one = done) → read back. Tested against a mock API by scripts/check_publish_workflow.ts.
      - name: Create the GitHub Release (REST API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/publish-workflow.ts release "${GITHUB_REF_NAME}"
