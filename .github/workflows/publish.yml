# The release workflow — the workspace's release-process.md § 5 (U5–U9), in 🔒 the owner's order
# (2026-11-10, decision D1): "the CI to check first, then push the tag, and then create the release
# page from the tag, then publish the package to the registry for the project in that order."
#
# The local `deno task release` (scripts/release.ts, U4) pushes `main` with the `bump to vX.Y.Z`
# commit and NO tag. Every push to `main` runs this workflow:
#
#   checks   contents: read    U5: HEAD = github.sha; "is this a release?" — the tag on origin AND
#                              JSR must agree (absent / absent = a release; present / present = not;
#                              a tag without the JSR version = a STRANDED release, refused on every
#                              push until finished; JSR without the tag = refused); for a release,
#                              the surface floor on the untagged candidate (api-surface.ts
#                              --verify-release); the type check; the publish dry run on exactly
#                              the tree the jsr job publishes
#   tag      contents: write   U6: CI creates the annotated tag on github.sha (an existing one at
#                              this commit = done; elsewhere = refused, a tag never moves), reads back
#   release  contents: write   U7: the GitHub Release page FROM the tag — REST API, never `gh`; an
#                              existing page = done; read back
#   jsr      id-token: write   U8, LAST: the published files only; NOTHING but Deno and this repo's
#                              own script beside the OIDC token (no Bun, no other action than
#                              checkout / setup-deno); skips if JSR already has the version;
#                              `deno publish` DIRECTLY
#   verify   contents: read    U8's read-back, FATAL, without the OIDC token: JSR's Rekor id (a 404
#                              throughout = the publish never happened, said so by name)
#
# Every `setup-bun` gets `token: ""`: the action otherwise takes the job's GITHUB_TOKEN (its
# default, read in its pinned action.yml — review round 1, 2026-11-12, finding E), and the tag and
# release jobs hold a WRITE token. Bun's version is pinned, so the action needs no API lookup.
#
# A push that is not a release runs `checks` only. A failure: "Re-run failed jobs" — `checks`'
# outputs are kept, the tag, the page and the upload each skip what is already done (U12); never a
# new tag for the same code, never a moved tag. "Re-run all jobs" (or any later push) instead meets
# the tag without the JSR version and FAILS as a stranded release, by name — it is never green.
# The version tag IS the release (owner, 2026-11-10): no `release/<tag>` branch.
#
# A tag made by github-actions[bot] in the same run DOES publish to JSR with provenance: measured
# on binaryang's 3.0.3 and 3.0.4 (2026-11-11, released in this order; re-read by wasmtk 2026-11-12:
# both tags annotated, tagger github-actions[bot]; JSR Rekor 3814264552 / 3815373888). Nothing
# here waits for a tag trigger (the jobs chain with `needs:`), so the OIDC identity is this run's.
# wasmtk's own first release in this order is still the first measurement of THIS file's tag →
# page → publish half. Tests are NOT run in `checks` yet: wasmtk's gate is local (installed
# `wasmtk`, Go, Zig, standalone engines); a CI gate is Deno-exit plan P7.
#
# Every action is pinned to a commit hash; the comment names its release. Move a pin by reading
# the release tag's commit with `git ls-remote` (verified 2026-11-10 for the three below).
# JSR side: `@jrmarcum/wasmtk` is linked to this repository; no JSR token is needed with OIDC.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# One run at a time, QUEUED, never cancelled: a cancelled run between the tag and the publish
# would leave a tag and a page for a version JSR never got (C30 (2)).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.rel.outputs.release }}
      version: ${{ steps.rel.outputs.version }}
      tag: ${{ steps.rel.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # the compatibility gate reads the PREVIOUS v* tag's surface
          persist-credentials: false

      # Every script runs on Bun, locally and here, so the local gate IS CI's gate (workspace
      # `working-rules.md` § The gate; Tooling rule 1). Pinned to the installed Bun (rule 10).
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
          token: "" # never the job's GITHUB_TOKEN (the action's default)

      # Deno for `deno doc` (the surface JSR sees), the type check and `deno publish` only.
      # DO NOT pin the Deno version to chase JSR provenance: tried 2026-07-30 and RULED OUT (the
      # 2026-07 outage was scope-wide and outside this repo; cmem/design-decisions.md).
      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # The code checks come FIRST, so a JSR outage cannot hide them (review round 2, R2-D).
      - name: Type-check
        run: deno check main.ts

      # The `jsr` job publishes from a checkout of deno.json's `publish.include` (+ deno.lock)
      # alone. Rehearse exactly that tree here.
      - name: Checkout the published files only (as the jsr job does)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: jsr-tree
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /deno.json
            /deno.lock
            /main.ts
            /src/
            /README.md
            /LICENSE
            /LICENSE-MIT
            /LICENSE-APACHE

      - name: JSR dry run, on the tree the jsr job publishes
        working-directory: jsr-tree
        run: deno publish --dry-run

      - name: Is this a release? (HEAD = github.sha; the tag on origin and JSR must agree)
        id: rel
        run: bun scripts/publish-workflow.ts is-release

      # The local `deno task bump` ran the compatibility gate; this repeats it on the pushed
      # commit before CI tags it (H6, Rule 3): the snapshot matches, one SemVer step at or above
      # the floor since the previous tag, no removal without a deprecation release (Rule 4).
      - name: Compatibility gate on the release candidate
        if: steps.rel.outputs.release == 'true'
        run: bun scripts/api-surface.ts --verify-release

      # `deno task release`'s commit-level gate, repeated on the pushed commit, so a bump pushed
      # by hand (or any push that changes the version) is not released without it (review round 2,
      # R2-B): the subject `bump to v<version>`, version lines only, both reviews recorded.
      - name: Release commit gate (the bump commit, both reviews recorded)
        if: steps.rel.outputs.release == 'true'
        run: bun scripts/release.ts --verify-commit

  tag:
    name: Tag ${{ needs.checks.outputs.tag }}
    needs: checks
    if: needs.checks.outputs.release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout the workflow script and the manifest only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /deno.json
            /scripts/publish-workflow.ts

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
          token: "" # never the job's GITHUB_TOKEN (the action's default)

      - name: Create the annotated tag on this commit (REST API), read back
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: bun scripts/publish-workflow.ts tag "$TAG"

  release:
    name: GitHub Release ${{ needs.checks.outputs.tag }}
    needs: [checks, tag]
    if: needs.checks.outputs.release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Only the release script and the manifest it reads the package name from: no package code
      # beside the write token, and the checkout keeps no credential.
      - name: Checkout the workflow script and the manifest only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /deno.json
            /scripts/publish-workflow.ts

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
          token: "" # never the job's GITHUB_TOKEN (the action's default)

      # The tag peels to this commit → an existing page = done → the page ON the tag → read back.
      # Tested against a mock API by scripts/check_publish_workflow.ts.
      - name: Create the GitHub Release from the tag (REST API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: bun scripts/publish-workflow.ts release "$TAG"

  jsr:
    name: Publish ${{ needs.checks.outputs.tag }} to JSR
    needs: [checks, release]
    if: needs.checks.outputs.release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      # What deno.json publishes, and the one script this job runs. Nothing else.
      - name: Checkout the published files and the workflow script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /deno.json
            /deno.lock
            /main.ts
            /src/
            /README.md
            /LICENSE
            /LICENSE-MIT
            /LICENSE-APACHE
            /scripts/publish-workflow.ts

      # Deno is the ONLY tool installed beside the OIDC token (no Bun here; review round 1,
      # finding E). The two script steps run this repo's own file under Deno with only the
      # permissions named, and `--no-config` (no import map, no lockfile write).
      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # A re-run finds the version there and skips the upload.
      - name: Does JSR already have this version?
        id: jsr
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: >-
          deno run --no-config --allow-net=api.jsr.io
          --allow-env=GITHUB_OUTPUT,HTTP_TIMEOUT_MS,JSR_HAS_TRIES,JSR_HAS_WAIT_S
          --allow-write="$GITHUB_OUTPUT"
          scripts/publish-workflow.ts jsr-has "$VERSION"

      # Provenance requires a GitHub OIDC token; `id-token: write` above injects it. If it is absent
      # despite the permission, an org/enterprise Actions OIDC policy blocks it and `deno publish`
      # silently skips provenance. The PREREQUISITE only — a diagnostic, not evidence.
      - name: Check OIDC availability (prerequisite, not proof)
        run: >-
          deno run --no-config
          --allow-env=ACTIONS_ID_TOKEN_REQUEST_URL,ACTIONS_ID_TOKEN_REQUEST_TOKEN
          scripts/publish-workflow.ts oidc-check

      # `deno publish` called DIRECTLY: through a task or a wrapper it runs as a subprocess, which
      # can lose provenance (binaryang's measurement). scripts/** is outside publish.include.
      - name: Publish to JSR (with provenance)
        if: steps.jsr.outputs.present == 'false'
        run: deno publish

  # U8's read-back, in its own job WITHOUT the OIDC token. It runs whatever `jsr` did (a failure
  # after the upload included), and FAILS when JSR records no provenance — or, by name, when JSR
  # does not serve the version at all (the publish never happened).
  verify:
    name: Verify ${{ needs.checks.outputs.tag }} on JSR
    needs: [checks, jsr]
    # Only when `jsr` RAN (succeeded or failed; a re-run whose upload was skipped still ran it):
    # when an earlier job failed, `jsr` is skipped and there is nothing to read back — the failure
    # is the earlier job's, not "the publish did not happen" (review round 2, R2-D).
    if: ${{ !cancelled() && needs.jsr.result != 'skipped' && needs.checks.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout the workflow script and the manifest only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /deno.json
            /scripts/publish-workflow.ts

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
          token: "" # never the job's GITHUB_TOKEN (the action's default)

      # THE evidence, FATAL (U8): JSR's `rekorLogId` (the poll, its cache-bust and their history:
      # scripts/publish-workflow.ts).
      - name: Verify provenance was recorded on JSR
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: bun scripts/publish-workflow.ts provenance "$VERSION"
